[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-from-scratch"
version = "0.1.0"
description = "An executable textbook and a small coding agent grounded in Codex source"
requires-python = ">=3.12"
dependencies = ["Pillow==13.0.0"]

[project.optional-dependencies]
notebooks = [
  "nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0",
  "jupyterlab==4.6.6",
]

[project.scripts]
mini-codex = "mini_codex.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_codex*"]

[tool.setuptools.package-data]
mini_codex = ["assets/checks/*.json", "assets/fixtures/task-list/*.py"]
